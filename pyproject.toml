[project]
name = "ward"
version = "0.1.0"
description = "Financial market data analysis tool with Web UI"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.0",
    "anthropic>=0.90.0",
    "click>=8.3.0",
    "fastapi>=0.135.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.42.0",
    "yfinance>=1.5.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
